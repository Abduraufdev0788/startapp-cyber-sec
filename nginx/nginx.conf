# ==============================================================================
# StartApp PhishGuard — Nginx Reverse Proxy Configuration
# Place this file in /etc/nginx/sites-available/phishguard (or include in nginx.conf)
# ==============================================================================

upstream phishguard_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _; # O'zingizning serveringiz IP manzili yoki domenini kiriting

    client_max_body_size 10M;

    # Gzip siqish (Statik fayllarni tezroq uzatish uchun)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Kiberxavfsizlik sarlavhalari (Security Headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Statik fayllarni keshlash
    location /static/ {
        proxy_pass http://phishguard_backend/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Barcha so'rovlar (Login, Admin Dashboard, API) FastAPI ga yo'naltiriladi
    location / {
        proxy_pass http://phishguard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

