<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartApp PhishGuard — Tizimga Kirish (Admin Login)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin/admin.css">
  <style>
    /* Specialized Cyber Login Layout */
    .login-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
    }

    .login-card {
      background: rgba(13, 20, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(6, 182, 212, 0.12);
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #06b6d4, #6366f1, #10b981);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-shield-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      box-shadow: 0 0 24px rgba(6, 182, 212, 0.3);
      position: relative;
    }

    .login-shield-icon svg {
      filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.6));
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-title span {
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 0.35rem;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.25);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      margin-top: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #e2e8f0;
      margin-bottom: 0.45rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-dim);
      pointer-events: none;
      transition: color 0.2s;
    }

    .cyber-form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem 0.85rem 2.85rem;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .cyber-form-input:focus {
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.25);
    }

    .cyber-form-input:focus + .input-icon,
    .cyber-form-input:focus ~ .input-icon {
      color: var(--accent-cyan);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0.35rem;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .toggle-pwd-btn:hover {
      color: #fff;
    }

    /* Alert Banner */
    .auth-alert {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      margin-bottom: 1.25rem;
      align-items: flex-start;
      gap: 0.65rem;
      animation: alertSlide 0.2s ease;
    }

    @keyframes alertSlide {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .auth-alert-success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #86efac;
    }

    .auth-alert-info {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
    }

    /* Submit Button */
    .btn-submit-login {
      width: 100%;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.95rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35);
      transition: all 0.25s ease;
      margin-top: 1.5rem;
    }

    .btn-submit-login:hover:not(:disabled) {
      background: linear-gradient(135deg, #0891b2, #1d4ed8);
      box-shadow: 0 6px 28px rgba(6, 182, 212, 0.5);
      transform: translateY(-1px);
    }

    .btn-submit-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .spinner-icon {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Quick Demo / Initial Admin Hint Box */
    .demo-hint-card {
      margin-top: 1.75rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      text-align: left;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-hint-card:hover {
      background: rgba(6, 182, 212, 0.05);
      border-color: rgba(6, 182, 212, 0.3);
    }

    .demo-hint-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.35rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .demo-hint-badge {
      font-size: 0.7rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .demo-credentials {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .login-footer-security {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.76rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
  </style>
</head>
<body class="cyber-theme">
  <!-- Glowing Spheres & Grid -->
  <div class="glow-sphere sphere-1"></div>
  <div class="glow-sphere sphere-2"></div>
  <div class="grid-overlay"></div>

  <!-- Centered Login Viewport -->
  <div class="login-viewport">
    <div class="login-container">
      <div class="login-card">
        <!-- Brand Header -->
        <div class="login-brand-header">
          <div class="login-shield-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <div class="login-title">PhishGuard <span>AI</span></div>
          <div class="login-subtitle">Kiberxavfsizlik Boshqaruv Markazi</div>
          <div class="login-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            RBAC Himoyalangan Kirish
          </div>
        </div>

        <!-- Alert Notification -->
        <div id="login-alert" class="auth-alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="alert-icon">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div id="alert-text"></div>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLoginSubmit(event)" autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="login-email">Administrator Elektron Pochta</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input
                type="email"
                id="login-email"
                class="cyber-form-input"
                placeholder="admin@phishguard.uz"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Maxfiy Parol</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                type="password"
                id="login-password"
                class="cyber-form-input"
                placeholder="••••••••••••"
                required
                autocomplete="current-password"
                style="padding-right: 2.75rem;"
              />
              <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" title="Parolni ko'rsatish/yashirish">
                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btn-submit" class="btn-submit-login">
            <span class="spinner-icon" id="btn-spinner"></span>
            <svg id="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            <span id="btn-label">Tizimga Kirish</span>
          </button>
        </form>

        <!-- Quick Demo / Initial Admin Auto-Fill Card -->
        <div class="demo-hint-card" onclick="quickFillCredentials()" title="Bir marta bosishda avtomatik to'ldirish">
          <div class="demo-hint-header">
            <span>⚡ Standart Administrator Hisobi:</span>
            <span class="demo-hint-badge">Bir bosishda to'ldirish</span>
          </div>
          <div class="demo-credentials">
            Email: <strong style="color: #38bdf8;">admin@phishguard.uz</strong><br>
            Parol: <strong style="color: #38bdf8;">AdminPhishGuard2025!</strong>
          </div>
        </div>

        <!-- Security Footer -->
        <div class="login-footer-security">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>256-bit AES Shifrlangan Tizim • RBAC Nazorati</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Check if already authenticated on initial page load
    (function checkInitialAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('expired') === '1') {
        showAlert('Sessiyangiz muddati tugadi. Iltimos qaytadan kiring.', 'info');
      }

      const existingToken = localStorage.getItem('phishguard_admin_token');
      if (existingToken) {
        // Quick verification with backend
        fetch('/api/v1/admin/stats', {
          headers: { 'Authorization': 'Bearer ' + existingToken }
        }).then(res => {
          if (res.ok) {
            window.location.replace('/admin');
          } else {
            localStorage.removeItem('phishguard_admin_token');
          }
        }).catch(() => {
          // Keep on login page if network error
        });
      }
    })();

    // Password visibility toggle
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        `;
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    }

    // Quick-Fill credentials handler
    function quickFillCredentials() {
      document.getElementById('login-email').value = 'admin@phishguard.uz';
      document.getElementById('login-password').value = 'AdminPhishGuard2025!';
      showAlert("Standart administrator ma'lumotlari kiritildi. 'Tizimga Kirish' tugmasini bosing.", 'info');
    }

    // Alert Banner Manager
    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('login-alert');
      const alertText = document.getElementById('alert-text');
      alertBox.className = 'auth-alert auth-alert-' + type;
      alertText.innerText = message;
      alertBox.style.display = 'flex';
    }

    function hideAlert() {
      document.getElementById('login-alert').style.display = 'none';
    }

    // Handle Form Submit
    async function handleLoginSubmit(event) {
      event.preventDefault();
      hideAlert();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showAlert('Iltimos, elektron pochta va parolni kiriting.', 'error');
        return;
      }

      const btn = document.getElementById('btn-submit');
      const btnLabel = document.getElementById('btn-label');
      const btnIcon = document.getElementById('btn-icon');
      const btnSpinner = document.getElementById('btn-spinner');

      // Loading state
      btn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnIcon.style.display = 'none';
      btnLabel.innerText = 'Tekshirilmoqda...';

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          const errCode = data?.error?.code;
          let errMsg = data?.error?.message || 'Kirishda xatolik yuz berdi.';

          if (response.status === 401 || errCode === 'INVALID_CREDENTIALS') {
            errMsg = 'Elektron pochta yoki parol noto\'g\'ri. Iltimos qayta tekshiring.';
          } else if (response.status === 403 || errCode === 'ACCOUNT_DISABLED') {
            errMsg = 'Ushbu administrator hisobi faol emas yoki bloklangan.';
          } else if (response.status === 429) {
            errMsg = 'Juda ko\'p urinishlar qilindi. Xavfsizlik yuzasidan 1 daqiqadan so\'ng qayta urining.';
          }

          showAlert(errMsg, 'error');
          return;
        }

        // Store tokens & user data securely in localStorage
        const authData = data.data;
        localStorage.setItem('phishguard_admin_token', authData.access_token);
        if (authData.refresh_token) {
          localStorage.setItem('phishguard_refresh_token', authData.refresh_token);
        }
        localStorage.setItem('phishguard_user_email', authData.email || email);
        localStorage.setItem('phishguard_user_role', authData.role || 'ADMIN');

        showAlert("Muvaffaqiyatli! Boshqaruv markaziga yo'naltirilmoqda...", 'success');
        btnLabel.innerText = 'Yo\'naltirilmoqda...';

        setTimeout(() => {
          window.location.replace('/admin');
        }, 500);

      } catch (err) {
        showAlert('Server bilan bog\'lanishda xatolik yuz berdi. Backend ishlayotganligini va tarmoqni tekshiring.', 'error');
      } finally {
        btn.disabled = false;
        btnSpinner.style.display = 'none';
        btnIcon.style.display = 'inline-block';
        btnLabel.innerText = 'Tizimga Kirish';
      }
    }
  </script>
</body>
</html>
